name: OpenFeelings
options:
  bundleIdPrefix: dev.finklea
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 34
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  OpenFeelings:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OpenFeelings
        excludes:
          - "ExportOptions.plist"
    dependencies:
      - sdk: HealthKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: UserNotifications.framework
      - sdk: WatchConnectivity.framework
      - target: OpenFeelingsWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.openfeelings
        DEVELOPMENT_TEAM: K7CBQW6MPG
        PRODUCT_NAME: OpenFeelings
        INFOPLIST_FILE: OpenFeelings/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenFeelings/OpenFeelings.entitlements
    scheme:
      testTargets:
        - OpenFeelingsTests
        - OpenFeelingsUITests
        - OpenFeelingsWatchTests
  OpenFeelingsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: OpenFeelingsWatch
      - path: OpenFeelings/Shared
      - path: OpenFeelings/Models/EmotionTaxonomy.swift
      - path: OpenFeelings/Models/BodyTaxonomy.swift
    dependencies:
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.openfeelings.watchkitapp
        DEVELOPMENT_TEAM: K7CBQW6MPG
        PRODUCT_NAME: OpenFeelingsWatch
        INFOPLIST_FILE: OpenFeelingsWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenFeelingsWatch/OpenFeelingsWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - OpenFeelingsWatchTests
  OpenFeelingsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OpenFeelingsTests
    dependencies:
      - target: OpenFeelings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.openfeelings.tests
        DEVELOPMENT_TEAM: K7CBQW6MPG
        GENERATE_INFOPLIST_FILE: YES
  OpenFeelingsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OpenFeelingsUITests
    dependencies:
      - target: OpenFeelings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.openfeelings.uitests
        DEVELOPMENT_TEAM: K7CBQW6MPG
        TEST_TARGET_NAME: OpenFeelings
        GENERATE_INFOPLIST_FILE: YES
  OpenFeelingsWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: OpenFeelingsWatchTests
    dependencies:
      - target: OpenFeelingsWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.openfeelings.watchkitapp.tests
        DEVELOPMENT_TEAM: K7CBQW6MPG
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        SUPPORTS_MACCATALYST: NO
